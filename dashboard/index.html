<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Mobile Controller</title>
  <style>
    body { background: #121212; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    #screen-box { width: 320px; height: 640px; background: #000; border: 2px solid #00ff88; margin: 20px auto; position: relative; touch-action: none; display: flex; align-items: center; justify-content: center; }
    .btn { padding: 10px 20px; background: #00ff88; color: #000; border: none; font-weight: bold; margin: 5px; cursor: pointer; border-radius: 4px; }
    input { padding: 10px; border-radius: 4px; border: 1px solid #00ff88; background: #222; color: white; }
  </style>
</head>
<body>
  <h2>Android Remote Control</h2>
  <div>
    <input type="text" id="deviceId" placeholder="Enter Target Device ID">
    <button class="btn" onclick="connect()">Connect</button>
  </div>
  
  <div id="screen-box" onclick="sendTap(event)">
    <p id="status-text">Connect button par tap karein</p>
  </div>

  <script>
    let ws;

    function connect() {
      const devId = document.getElementById('deviceId').value.trim();
      if (!devId) {
        alert('Pehle Target Device ID dalein!');
        return;
      }

      // Render Secure WebSocket Connection
      ws = new WebSocket('wss://remote-android-control.onrender.com'); 
      
      ws.onopen = () => {
        document.getElementById('status-text').innerText = 'Connected! Screen area par tap karke control karein.';
        alert('Server se connect ho gaya!');
        
        // Server ko registration payload bhejna
        ws.send(JSON.stringify({
          type: 'REGISTER_CLIENT',
          clientId: 'dashboard_' + Math.random().toString(36).substring(7)
        }));
      };

      ws.onerror = (err) => {
        console.error('WebSocket Error:', err);
        document.getElementById('status-text').innerText = 'Connection Error!';
        alert('Server connection fail ho gaya. Render deployment check karein.');
      };

      ws.onclose = () => {
        document.getElementById('status-text').innerText = 'Disconnected';
      };
    }

    function sendTap(e) {
      const devId = document.getElementById('deviceId').value.trim();
      
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert('Server disconnected hai! Pehle Connect button dabayein.');
        return;
      }

      if (!devId) {
        alert('Device ID hona zaruri hai!');
        return;
      }

      const rect = e.currentTarget.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      
      // Target Device ko Control Command bhejna
      ws.send(JSON.stringify({
        type: 'COMMAND',
        deviceId: devId,
        payload: { 
          action: 'TAP', 
          x: parseFloat(x.toFixed(4)), 
          y: parseFloat(y.toFixed(4)) 
        }
      }));

      console.log(`Tap sent -> X: ${x.toFixed(2)}, Y: ${y.toFixed(2)} to Device: ${devId}`);
    }
  </script>
</body>
</html>
